<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>おばけあそび</title>
<meta name="description" content="QRコードで遊べる、おばけのミニゲーム。アプリのインストールはいりません。">
<meta name="theme-color" content="#140f22">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="soundToggle" class="sound-toggle" type="button" aria-pressed="true" aria-label="おとを だす／けす">
  <span id="soundIcon" aria-hidden="true">🔊</span>
</button>

<main id="app">

  <!-- ===== メニュー（あそびを えらぶ） ===== -->
  <section id="screen-menu" class="screen is-active">
    <div class="title-art" aria-hidden="true">
      <svg viewBox="0 0 100 100" class="float"><use href="#ghost-shiro" xlink:href="#ghost-shiro"></use></svg>
    </div>
    <h1 class="title">おばけあそび</h1>
    <p class="title-sub">あそびたいものを えらんでね</p>

    <!-- ここに JavaScript が ゲームのボタンを ならべます -->
    <div id="menu-list" class="menu-list"></div>

    <p class="note">
      ならんでいる あいだに あそべます。<br>
      あるきながらは あそばないでね。
    </p>
  </section>

  <!-- ===== ゲーム ===== -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <button id="btn-back" class="back-button" type="button" aria-label="やめて もどる">←</button>
      <div class="hud__score">
        <span id="score-label" class="hud__label">とくてん</span>
        <span id="score" class="hud__value">0</span>
      </div>
      <div id="hud-time" class="hud__time">
        <div class="timebar"><div id="timebar-fill" class="timebar__fill"></div></div>
        <span id="time-left" class="hud__time-text">30</span>
      </div>
    </header>
    <div id="field" class="field">
      <div id="rush-banner" class="rush-banner" hidden>おばけ だいはっせい！</div>
    </div>
  </section>

  <!-- ===== けっか ===== -->
  <section id="screen-result" class="screen">
    <div id="rank-art" class="rank-art" aria-hidden="true">
      <svg viewBox="0 0 100 100"><use id="rank-use" href="#ghost-shiro" xlink:href="#ghost-shiro"></use></svg>
    </div>
    <p id="result-game" class="result-lead">おばけタッチ</p>
    <h2 id="rank-name" class="rank-name">おばけみならい</h2>
    <p class="result-score"><span id="result-score">0</span><span id="result-unit" class="result-score__unit">てん</span></p>
    <p id="new-record" class="new-record" hidden>🎉 じぶんの さいこうきろく！</p>
    <p id="result-best" class="best-line"></p>
    <div class="button-row">
      <button id="btn-retry" class="big-button" type="button">
        <span class="big-button__icon" aria-hidden="true">↻</span>もういちど
      </button>
      <button id="btn-menu" class="big-button big-button--secondary" type="button">
        <span class="big-button__icon" aria-hidden="true">☰</span>ほかのあそび
      </button>
    </div>
    <p class="note">つぎの ひとに スマホを かしてあげてね。</p>
  </section>

</main>

<!-- だいはっせい 開始時に 画面いっぱいに パッと出る演出（1秒ほどで消えます） -->
<div id="rush-flash" class="rush-flash" hidden aria-hidden="true">
  <div class="rush-flash__ghosts">
    <svg viewBox="0 0 100 100"><use href="#ghost-shiro" xlink:href="#ghost-shiro"></use></svg>
    <svg viewBox="0 0 100 100"><use href="#ghost-kabocha" xlink:href="#ghost-kabocha"></use></svg>
    <svg viewBox="0 0 100 100"><use href="#ghost-hinotama" xlink:href="#ghost-hinotama"></use></svg>
  </div>
  <p class="rush-flash__text">おばけ<br>だいはっせい！</p>
</div>

<!-- おばけの絵（SVG）。ここに置いた絵をゲーム中に呼び出します -->
<svg class="svg-sprite" aria-hidden="true" focusable="false">
  <defs>

    <!-- しろおばけ：1てん -->
    <symbol id="ghost-shiro" viewBox="0 0 100 100">
      <path d="M50 6c-20 0-34 15-34 36v42l9-9 9 9 9-9 9 9 9-9 9 9 9-9 5 5V42C84 21 70 6 50 6z"
            fill="#f6f4ff" stroke="#2b2247" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="38" cy="42" rx="6" ry="8" fill="#2b2247"/>
      <ellipse cx="62" cy="42" rx="6" ry="8" fill="#2b2247"/>
      <path d="M42 62q8 9 16 0" fill="none" stroke="#2b2247" stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <!-- ひのたま：2てん -->
    <symbol id="ghost-hinotama" viewBox="0 0 100 100">
      <path d="M50 4c6 18 26 24 26 46 0 18-12 32-26 32S24 68 24 50C24 28 44 22 50 4z"
            fill="#6fe3ff" stroke="#123a63" stroke-width="4" stroke-linejoin="round"/>
      <path d="M50 30c4 10 14 14 14 26 0 10-6 18-14 18s-14-8-14-18c0-12 10-16 14-26z" fill="#d6f8ff"/>
      <circle cx="42" cy="54" r="4.5" fill="#123a63"/>
      <circle cx="58" cy="54" r="4.5" fill="#123a63"/>
      <path d="M44 68q6 6 12 0" fill="none" stroke="#123a63" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>

    <!-- かぼちゃおばけ：3てん -->
    <symbol id="ghost-kabocha" viewBox="0 0 100 100">
      <path d="M50 22c-4-8-2-14 2-18" fill="none" stroke="#3f7a2f" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="50" cy="58" rx="40" ry="34" fill="#ff9b3d" stroke="#7a3708" stroke-width="4"/>
      <path d="M32 26c-8 16-8 48 0 64M68 26c8 16 8 48 0 64" fill="none" stroke="#7a3708" stroke-width="3" opacity=".6"/>
      <path d="M30 48l14-8 4 14zM70 48l-14-8-4 14z" fill="#7a3708"/>
      <path d="M28 68h44l-7 8-8-5-7 6-7-6-8 5z" fill="#7a3708"/>
    </symbol>

    <!-- こうもり（カードあわせ用） -->
    <symbol id="ghost-koumori" viewBox="0 0 100 100">
      <path d="M50 46C40 30 22 26 6 34c10 4 14 12 12 22 8-4 16-2 20 6 2-6 6-10 12-12 6 2 10 6 12 12 4-8 12-10 20-6-2-10 2-18 12-22-16-8-34-4-44 12z"
            fill="#8b6cff" stroke="#2b2247" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="50" cy="56" rx="12" ry="15" fill="#6a4be0" stroke="#2b2247" stroke-width="4"/>
      <path d="M42 40l3 8h-6zM58 40l-3 8h6z" fill="#6a4be0" stroke="#2b2247" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="45" cy="54" r="3" fill="#fff"/>
      <circle cx="55" cy="54" r="3" fill="#fff"/>
      <path d="M46 64q4 4 8 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>

  </defs>
</svg>

<!-- きょうつうの しくみ -->
<script src="js/storage.js" defer></script>
<script src="js/sound.js" defer></script>
<script src="js/ghosts.js" defer></script>
<script src="js/app.js" defer></script>
<!-- それぞれの ゲーム（ならんだ じゅんに メニューに 出ます） -->
<script src="js/games/touch.js" defer></script>
<script src="js/games/odd.js" defer></script>
<script src="js/games/match.js" defer></script>
</body>
</html>
